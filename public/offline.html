<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline - WATCHD</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #09090b;
        color: #e4e4e7;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #18181b;
        border: 1px solid #27272a;
        padding: 36px 28px;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .icon-box {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #dc2626, #f59e0b);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.4);
      }
      .icon-box svg {
        width: 36px;
        height: 36px;
        fill: #ffffff;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #a1a1aa;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        background: linear-gradient(to right, #dc2626, #ea580c);
        color: #ffffff;
        text-decoration: none;
      }
      .btn:hover {
        opacity: 0.95;
        transform: scale(1.02);
      }
      .btn-secondary {
        background: #27272a;
        color: #d4d4d8;
        margin-top: 10px;
        border: 1px solid #3f3f46;
      }
      .btn-secondary:hover {
        background: #3f3f46;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21" />
        </svg>
      </div>
      <h1>You're Currently Offline</h1>
      <p>
        No internet connection detected. Please check your Wi-Fi or mobile data to continue streaming movies and series.
      </p>
      <button class="btn" onclick="window.location.reload()">
        🔄 Retry Connection
      </button>
      <a href="/watchlist" class="btn btn-secondary">
        📂 View Saved Watchlist
      </a>
    </div>
  </body>
</html>
